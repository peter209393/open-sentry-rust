name: production-acceptance

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentry
          POSTGRES_PASSWORD: sentry
          POSTGRES_DB: open_sentry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentry -d open_sentry"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: npm ci && npm test && npm run lint
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: docker build --tag open-sentry-backend:test .
      - run: docker build --tag open-sentry-frontend:test ./frontend
